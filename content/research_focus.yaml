- title: Online Safety &amp; Stalking
  description: How technology enables intimate partner surveillance and stalking — from stalkerware detection
    to AirTag-facilitated tracking — and how we can better protect at-risk people.
- title: Intimate-Image-Based Abuse
  description: Understanding and countering the non-consensual sharing of intimate images within end-to-end-encrypted
    messaging platforms, where moderation is architecturally constrained.
- title: Authentication &amp; Security UX
  description: Why security features like authentication ceremonies and consent mechanisms fail users
    in practice — and how to design them to be genuinely usable rather than theatrical.
- title: Methods in Usable Security
  description: Developing and evaluating rigorous empirical methods — including qualitative analysis,
    autoethnography, and systematic reviews — for usable privacy and security research.
