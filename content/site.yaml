  Collaborateur Scientifique at EPFL.
og_description: HCI researcher working on security, privacy, and safety. Collaborateur Scientifique at EPFL.
bio_paragraphs:
- |-
  I am an interdisciplinary HCI researcher working on security, privacy, and safety. My current work focuses on <strong>technology-mediated stalking</strong> and <strong>intimate-image-based abuse</strong> in end-to-end-encrypted messengers.
- |-
  I hold a Dr.-Ing. from Saarland University and bring a background in computer engineering, cultural&nbsp;&amp;&nbsp;social anthropology, privacy advocacy, and EU cybercrime policy.
