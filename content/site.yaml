meta_description: Matthias Fassl is an interdisciplinary HCI researcher working on security, privacy,
  and safety — including technology-mediated stalking, intimate-image-based abuse, and usable authentication.
  Postdoctoral Researcher at George Washington University, incoming Collaborateur Scientifique at EPFL.
og_description: HCI researcher working on security, privacy, and safety. Postdoc at GWU, incoming Collaborateur
  Scientifique at EPFL.
bio_paragraphs:
- |-
  I am an interdisciplinary HCI researcher working on security, privacy, and safety. My current work focuses on <strong>technology-mediated stalking</strong> and <strong>intimate-image-based abuse</strong> in end-to-end-encrypted messengers, as part of <a href="https://gwusec.seas.gwu.edu/" style="color:var(--accent);">Adam Aviv's group</a> at GWU.
- |-
  🎉 Incoming <strong>Collaborateur Scientifique</strong> at EPFL.
- |-
  I hold a Dr.-Ing. from Saarland University and bring a background in computer engineering, cultural&nbsp;&amp;&nbsp;social anthropology, privacy advocacy, and EU cybercrime policy.
